{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devil Super Admin Login</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="{% static 'images/favicon.jpg' %}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0b0c10 0%, #1a020a 50%, #2a000e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow-x: hidden;
        }

        .login-card {
            background-color: rgba(20, 22, 28, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .brand-logo {
            max-height: 55px;
            margin-bottom: 12px;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #ff0055 0%, #ff3300 100%);
            border: none;
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-gradient:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(255, 0, 85, 0.4);
            color: #ffffff;
        }

        .form-control-custom {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-radius: 10px;
            padding: 12px 16px;
        }

        .form-control-custom:focus {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(255, 0, 85, 0.2);
        }

        .form-control-custom::placeholder {
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <img src="{% static 'images/logo.png' %}" alt="Devil Logo" class="brand-logo">
        <h4 class="fw-bold mt-2 mb-1">Super Admin Panel</h4>
        <p class="text-secondary small mb-4">Enter your credentials to access management console</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger p-2 small text-center rounded-3 mb-3">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="text-start mb-3">
                <label class="form-label small text-secondary fw-semibold">Phone Number or Email</label>
                <input type="text" name="phone_number" class="form-control form-control-custom" placeholder="ceo@pinecodestudio.com or +91..." required>
            </div>

            <div class="text-start mb-4">
                <label class="form-label small text-secondary fw-semibold">Password</label>
                <input type="password" name="password" class="form-control form-control-custom" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-gradient w-100">Sign In</button>
        </form>
    </div>

</body>
</html>
